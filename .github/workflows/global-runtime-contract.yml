name: Global Runtime Contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Runtime contract tests
        run: python -m unittest discover -s tests -p 'test_runtime_contract.py' -v

      - name: Validate Video Factory canonical mirror
        run: python tools/runtime_contract.py validate --root . --manifest runtime-contract/video-factory.runtime-contract.json
